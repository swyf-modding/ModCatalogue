name: Verify catalogue

# Runs on changes, and weekly. The weekly run is the one that matters most: a git tag can be
# moved and a release asset can be replaced after the fact, so a pin that verified at merge
# time is not guaranteed to still describe the same bytes a month later.

on:
  pull_request:
    paths:
      - 'mods.json'
      - 'tools/**'
      - '.github/workflows/verify-catalogue.yml'
  push:
    branches: [main]
    paths:
      - 'mods.json'
      - 'tools/**'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The rules are the part that can be wrong without anybody noticing for weeks, so
      # they have a test of their own. It needs no network and no releases.
      - name: Test the rules
        shell: pwsh
        run: ./tools/test-catalogue.ps1

      # The shape of the file first, and it costs nothing: no network, no release, no code.
      # A catalogue that does not follow the rules is one Switchboard refuses whole, so this
      # is the check that says so before the slow one starts.
      - name: Check the catalogue follows the rules
        shell: pwsh
        run: ./tools/check-catalogue.ps1

      - name: Verify pinned hashes and capabilities
        shell: pwsh
        env:
          # Lifts the unauthenticated GitHub API limit from 60/hour to 1000/hour.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/verify-catalogue.ps1
