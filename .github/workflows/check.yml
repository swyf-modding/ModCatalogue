name: Check a submission

# One submission, checked and reported on its issue. Called by the two thin triggers - a new
# issue, and a maintainer's command - so the pipeline exists once.
#
# What it does, in order:
#   - runs the checks, which download the release and read the code;
#   - writes the checks into a comment on the issue straight away, saying the review is running;
#   - asks the review service, when there is one, and updates that same comment with the verdict;
#   - opens the pull request itself when the checks pass and the review agrees, and otherwise
#     leaves it for a maintainer to ask for.
#
# The comment comes before the review on purpose: the checks take seconds and the review takes
# minutes, and an issue that says nothing for minutes looks broken.

on:
  workflow_call:
    inputs:
      issue:
        description: 'The submission issue number.'
        required: true
        type: string
      mode:
        description: 'auto, recheck, create-pr or force.'
        required: false
        type: string
        default: 'auto'
      actor:
        description: 'Who asked, when a person did.'
        required: false
        type: string
        default: ''
    secrets:
      BOT_APP_PRIVATE_KEY:
        required: true
      BOT_READ_TOKEN:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The review poll is half an hour: the reviewer itself may retry a reset connection, and
    # its own limit is twenty-two minutes. The rest is minutes, not hours. A stuck run should
    # end in a red X that says so rather than sit there.
    timeout-minutes: 45
    env:
      ISSUE: ${{ inputs.issue }}
      MODE: ${{ inputs.mode }}
      ASKED_BY: ${{ inputs.actor }}
      REVIEW_URL: ${{ vars.REVIEW_URL }}
    steps:
      - name: Sign in as the bot
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.bot.outputs.token }}

      - name: Read the submission
        id: submission
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          New-Item -ItemType Directory -Force -Path ./out | Out-Null

          $issue = gh api "repos/$($env:GITHUB_REPOSITORY)/issues/$($env:ISSUE)"
          $submission = $issue | ConvertFrom-Json
          if ($submission.body -notmatch 'swyf-modding-submission') {
            throw 'This issue is not a submission: it does not carry the marker the site writes.'
          }

          Set-Content -LiteralPath ./submission.md -Value $submission.body -NoNewline

          # The repository out of the title, which is "Mod submission: <repo>". A manual dispatch
          # has no title to take it from, so the body is used instead.
          $repo = if ($submission.title -like 'Mod submission:*') { $submission.title -replace '^Mod submission:\s*', '' }
          if (-not $repo) {
            $fenced = [regex]::Match($submission.body, '(?s)```json\s*(.*?)\s*```')
            if ($fenced.Success) {
              try { $repo = ($fenced.Groups[1].Value | ConvertFrom-Json).repo } catch { $repo = $null }
            }
          }
          'repo=' + $repo >> $env:GITHUB_OUTPUT

      # The mod is usually somebody else's repository, and an installation token can only see the
      # app's own. A token with no scopes reads any public repository and raises the API limit from
      # 60 an hour to 5000; without it this still works, just slower.
      - name: Check the release and read the code
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.BOT_READ_TOKEN }}
        run: |
          $ok = $true
          try {
            ./tools/submission.ps1 -BodyFile ./submission.md -OutDir ./out *>&1 |
              Tee-Object -FilePath ./out/log.txt
          }
          catch {
            $ok = $false
            ($_ | Out-String) | Add-Content -Path ./out/log.txt
          }

          'ok=' + $ok.ToString().ToLowerInvariant() >> $env:GITHUB_OUTPUT

      # Everything the checks found goes up now, with the review marked as running. This is the
      # acknowledgement: the submitter sees the issue answered within seconds, not after minutes.
      - name: Report the checks
        id: report-check
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          New-Item -ItemType Directory -Force -Path ./out | Out-Null

          # Best effort: the app may not have Reactions: write. The comment is the real signal.
          gh api -X POST "repos/$($env:GITHUB_REPOSITORY)/issues/$($env:ISSUE)/reactions" -f content=eyes *> $null
          if ($LASTEXITCODE -ne 0) { Write-Host 'Could not add the reaction.' }

          $ok = '${{ steps.check.outputs.ok }}' -eq 'true'
          $reviewing = -not [string]::IsNullOrWhiteSpace($env:REVIEW_URL)

          $splat = @{
            OutFile    = './out/comment.md'
            LabelsFile = './out/labels.txt'
          }
          if ($ok) {
            $splat.Report = './out/submission-report.md'
            if ($reviewing) { $splat.ReviewPending = $true }
          }
          else {
            if (-not (Test-Path ./out/log.txt)) {
              Set-Content -LiteralPath ./out/log.txt -Value 'The submission could not be read. The workflow log has the error.'
            }
            $splat.Failure = './out/log.txt'
          }

          ./tools/issue-comment.ps1 @splat

          $body = Get-Content -Raw ./out/comment.md
          if ($env:ASKED_BY) {
            $body = $body.TrimEnd() + "`n`n<sub>Requested by @$($env:ASKED_BY).</sub>`n"
          }

          $comments = gh api "repos/$($env:GITHUB_REPOSITORY)/issues/$($env:ISSUE)/comments?per_page=100" | ConvertFrom-Json
          $mine = $comments | Where-Object { $_.body -like '<!-- swyf-modding-check -->*' } | Select-Object -First 1

          Set-Content -LiteralPath ./out/comment-body.md -Value $body -NoNewline
          if ($mine) {
            gh api -X PATCH "repos/$($env:GITHUB_REPOSITORY)/issues/comments/$($mine.id)" -F body=@./out/comment-body.md | Out-Null
            Write-Host 'Updated the existing check comment.'
          }
          else {
            gh issue comment $env:ISSUE --body-file ./out/comment-body.md | Out-Null
            Write-Host 'Posted the check comment.'
          }

          # Labels: the state of this submission, at a glance in the issue list.
          $wanted = @(Get-Content ./out/labels.txt | Where-Object { $_ })
          $current = @((gh issue view $env:ISSUE --json labels --jq '.labels[].name') | Where-Object { $_ })

          foreach ($label in $wanted) {
            gh label create $label --force 2>$null | Out-Null
            if ($current -notcontains $label) { gh issue edit $env:ISSUE --add-label $label | Out-Null }
          }
          foreach ($label in $current) {
            if ($label -like 'review: *' -and $wanted -notcontains $label) {
              gh issue edit $env:ISSUE --remove-label $label | Out-Null
            }
          }

      - name: Review the submission
        id: review
        if: steps.check.outputs.ok == 'true' && vars.REVIEW_URL != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.BOT_READ_TOKEN }}
        run: |
          try {
            $catalogue = Get-Content -Raw ./out/mods.json | ConvertFrom-Json
            $mod = $catalogue.mods | Where-Object { $_.repo -eq '${{ steps.submission.outputs.repo }}' } | Select-Object -First 1
            if (-not $mod) { throw 'The entry is not in the new catalogue; nothing to review.' }

            $body = @{
              mods = @(@{
                owner       = $mod.owner
                repo        = $mod.repo
                release     = $mod.approvedVersion
                displayName = $mod.displayName
                summary     = $mod.summary
                files       = @($mod.files | ForEach-Object {
                  @{ fileName = $_.fileName; sha256 = $_.sha256; capabilities = @($_.capabilities); bepInPlugin = @($_.bepInPlugin) }
                })
              })
            } | ConvertTo-Json -Depth 8

            $headers = @{}
            if ($env:GH_TOKEN) { $headers['x-github-token'] = $env:GH_TOKEN }

            $response = Invoke-RestMethod -Uri "$env:REVIEW_URL/review" -Method Post -ContentType 'application/json' -Headers $headers -Body $body -TimeoutSec 60
            if (-not $response.id) { throw 'The review service did not return a job id.' }

            # A review takes as long as a model takes, so the answer is fetched rather than waited
            # for. A poll that fails a few times in a row is a service that is not there: say so
            # instead of polling a dead URL for half an hour.
            $result = $null
            $failures = 0
            for ($i = 0; $i -lt 180; $i++) {
              Start-Sleep -Seconds 10
              try {
                $poll = Invoke-RestMethod -Uri "$env:REVIEW_URL/result?id=$($response.id)" -Headers $headers -TimeoutSec 30
                $failures = 0
                if (-not $poll.pending) { $result = $poll; break }
              }
              catch {
                $failures++
                Write-Host "could not poll the review service ($failures): $($_.Exception.Message)"
                if ($failures -ge 3) { throw }
              }
            }
            if (-not $result) { throw 'The review service did not finish within half an hour.' }

            if (-not $result.results -or $result.results.Count -eq 0 -or -not $result.results[0].verdict) {
              throw 'The review service returned no verdict.'
            }

            $result | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath ./out/review.json
            Write-Host "review: $($result.results[0].verdict) - $($result.results[0].reason)"
            if ($result.results[0].detail) { Write-Host "review detail: $($result.results[0].detail)" }
            'state=' + $result.results[0].verdict >> $env:GITHUB_OUTPUT
          }
          catch {
            # The error is kept for the comment, and the job is still allowed to go red: a
            # maintainer should notice, and the issue should not be left saying "running".
            $text = ($_ | Out-String).Trim()
            if ($text.Length -gt 4000) { $text = $text.Substring(0, 4000) + "`n…" }
            Set-Content -LiteralPath ./out/review-error.txt -Value $text
            'state=failed' >> $env:GITHUB_OUTPUT
            throw
          }

      # The same comment, now with the answer. Written even when the review failed, so a red run
      # and a silent issue cannot happen together.
      - name: Report the review
        if: always() && steps.check.outputs.ok == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REVIEW_URL)) {
            Write-Host 'No review service is configured; the checks comment is the whole report.'
            exit 0
          }

          $splat = @{
            Report     = './out/submission-report.md'
            OutFile    = './out/comment.md'
            LabelsFile = './out/labels.txt'
          }
          if (Test-Path ./out/review-error.txt) {
            $splat.ReviewError = './out/review-error.txt'
          }
          elseif (Test-Path ./out/review.json) {
            $splat.Review = './out/review.json'
          }
          else {
            # The step ended without leaving either file. The comment must not stay on
            # "running" for the next person to find.
            Set-Content -LiteralPath ./out/review-error.txt -Value 'The review step ended without an answer. The workflow log has the rest.'
            $splat.ReviewError = './out/review-error.txt'
          }

          ./tools/issue-comment.ps1 @splat

          $body = Get-Content -Raw ./out/comment.md
          if ($env:ASKED_BY) {
            $body = $body.TrimEnd() + "`n`n<sub>Requested by @$($env:ASKED_BY).</sub>`n"
          }

          $comments = gh api "repos/$($env:GITHUB_REPOSITORY)/issues/$($env:ISSUE)/comments?per_page=100" | ConvertFrom-Json
          $mine = $comments | Where-Object { $_.body -like '<!-- swyf-modding-check -->*' } | Select-Object -First 1

          Set-Content -LiteralPath ./out/comment-body.md -Value $body -NoNewline
          if ($mine) {
            gh api -X PATCH "repos/$($env:GITHUB_REPOSITORY)/issues/comments/$($mine.id)" -F body=@./out/comment-body.md | Out-Null
            Write-Host 'Updated the check comment with the review.'
          }
          else {
            gh issue comment $env:ISSUE --body-file ./out/comment-body.md | Out-Null
            Write-Host 'Posted the check comment with the review.'
          }

          $wanted = @(Get-Content ./out/labels.txt | Where-Object { $_ })
          $current = @((gh issue view $env:ISSUE --json labels --jq '.labels[].name') | Where-Object { $_ })

          foreach ($label in $wanted) {
            gh label create $label --force 2>$null | Out-Null
            if ($current -notcontains $label) { gh issue edit $env:ISSUE --add-label $label | Out-Null }
          }
          foreach ($label in $current) {
            if ($label -like 'review: *' -and $wanted -notcontains $label) {
              gh issue edit $env:ISSUE --remove-label $label | Out-Null
            }
          }

      # When it is all good, the pull request is opened without anyone being asked. When it is not,
      # the comment says what is wrong and a maintainer decides with a command. A failed review
      # stops the job, and this too: the pull request is never opened on an answer nobody has.
      - name: Decide
        id: decide
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          $ok = '${{ steps.check.outputs.ok }}' -eq 'true'
          $state = '${{ steps.review.outputs.state }}'
          $reviewed = -not [string]::IsNullOrWhiteSpace($env:REVIEW_URL)
          $good = if ($reviewed) { $state -eq 'ok' } else { $true }
          $mode = $env:MODE

          $open = gh pr list --head "submission/issue-$env:ISSUE" --state open --json number --jq '.[0].number'
          $already = -not [string]::IsNullOrWhiteSpace($open)

          # A recheck is the same rule as a first submission: if it is all good now, it is opened
          # now - including when an earlier run held it back.
          $publish = switch ($mode) {
            'auto'      { $ok -and $good }
            'recheck'   { $ok -and $good }
            'create-pr' { $ok -and $state -ne 'refuse' }
            'force'     { $ok }
            default     { $false }
          }

          Write-Host "mode=$mode ok=$ok review=$state already=$already publish=$publish"
          'publish=' + ([bool]$publish).ToString().ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - name: Open or update the pull request
        if: steps.decide.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
        run: |
          $branch = "submission/issue-$env:ISSUE"
          $subject = gh api "repos/$($env:GITHUB_REPOSITORY)/issues/$($env:ISSUE)" --jq .title
          $found = gh pr list --head $branch --state all --json number,state --jq '.[0] | "\(.number) \(.state)"'
          $number = ($found -split ' ')[0]
          $state = ($found -split ' ')[1]

          $name = if ($env:BOT_SLUG) { "$($env:BOT_SLUG)[bot]" } else { 'swyf-modding-bot' }
          $email = if ($env:BOT_SLUG) { "$($env:BOT_SLUG)[bot]@users.noreply.github.com" } else { 'bot@swyf-modding.invalid' }
          git config user.name $name
          git config user.email $email

          git checkout -B $branch
          Copy-Item ./out/mods.json ./mods.json -Force
          git add mods.json

          if (git status --porcelain) {
            git commit -m "Add a mod from a submission: $subject"
            # One branch per issue, and the bot is the only thing that writes it.
            git push -u origin $branch --force
          }
          else {
            Write-Host 'The catalogue already says exactly this.'
          }

          $report = Get-Content -Raw ./out/submission-report.md
          $review = ''
          if (Test-Path ./out/review.json) {
            $result = (Get-Content -Raw ./out/review.json | ConvertFrom-Json).results[0]
            $headline = switch ($result.verdict) {
              'ok' { 'Ready to list' }
              'unsure' { 'Needs a look from a maintainer' }
              'refuse' { 'Not listed' }
              default { 'Reviewed' }
            }
            $review = "`n### Review`n`n**$headline**`n`n$($result.reason)`n`n<sub>Automated review of the code. A maintainer makes the final decision.</sub>"
          }

          $body = @"
          A mod submission, processed automatically.

          The entry was filled in and checked by the website, the release was downloaded and read,
          and the file hashes and capabilities in it come from the code itself.

          $report
          $review
          "@

          Set-Content -LiteralPath ./out/pr-body.md -Value $body -NoNewline

          if ($number) {
            gh pr edit $number --body-file ./out/pr-body.md | Out-Null
            if ($state -eq 'CLOSED') { gh pr reopen $number | Out-Null }
            $url = gh pr view $number --json url --jq .url
            Write-Host "Updated #$number."
          }
          else {
            $url = gh pr create --title $subject --body-file ./out/pr-body.md --base main --head $branch
          }

          gh label create 'pr: opened' --force 2>$null | Out-Null
          gh issue edit $env:ISSUE --add-label 'pr: opened' | Out-Null

          Set-Content -LiteralPath ./out/comment-body.md -Value "The pull request is at $url." -NoNewline
          gh api -X POST "repos/$($env:GITHUB_REPOSITORY)/issues/$($env:ISSUE)/comments" -F body=@./out/comment-body.md | Out-Null

      # The issue is the record; Discord is the nudge. One line per run, so a submission (or a
      # failed review) does not wait for somebody to refresh GitHub.
      - name: Announce on Discord
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
            Write-Host 'No Discord webhook is configured.'
            exit 0
          }

          $ok = '${{ steps.check.outputs.ok }}' -eq 'true'
          $state = '${{ steps.review.outputs.state }}'
          $kind = switch ($env:MODE) {
            'auto' { 'New submission' }
            'recheck' { 'Recheck' }
            default { 'Maintainer command' }
          }
          $outcome = if (-not $ok) { 'checks failed' }
            elseif ($state) { "review: $state" }
            elseif ($env:REVIEW_URL) { 'review did not finish' }
            else { 'checks passed' }

          $title = $null
          try { $title = gh api "repos/$($env:GITHUB_REPOSITORY)/issues/$($env:ISSUE)" --jq .title } catch { }
          if (-not $title) { $title = "Submission #$($env:ISSUE)" }
          $mod = $title -replace '^Mod submission:\s*', ''
          $url = "https://github.com/$($env:GITHUB_REPOSITORY)/issues/$($env:ISSUE)"

          $detail = $null
          if (Test-Path ./out/review.json) {
            $detail = (Get-Content -Raw ./out/review.json | ConvertFrom-Json).results[0].detail
          }
          elseif (Test-Path ./out/review-error.txt) {
            $detail = (Get-Content -Raw ./out/review-error.txt).Trim()
            if ($detail.Length -gt 300) { $detail = $detail.Substring(0, 300) + '...' }
          }

          $content = "**$mod** - $kind - $outcome"
          if ($detail) { $content += "`n$detail" }
          $content += "`n$url"
          # allowed_mentions: a mod name is not allowed to ping anyone.
          $payload = @{ content = $content; allowed_mentions = @{ parse = @() } } | ConvertTo-Json -Compress -Depth 4

          try {
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -ContentType 'application/json' -Body $payload -TimeoutSec 15 | Out-Null
            Write-Host 'Announced on Discord.'
          }
          catch {
            Write-Host "Could not announce on Discord: $($_.Exception.Message)"
          }
