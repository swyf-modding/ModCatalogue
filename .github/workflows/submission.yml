name: Process a mod submission

# A submission arrives as an issue, written by the website. This is the whole of the trigger: the
# work is in check.yml, which a maintainer's command calls too.
#
# When the checks pass and the review agrees, the pull request is opened without anyone being
# asked. Otherwise everything the run found is written to the issue, and a maintainer decides.

on:
  issues:
    # Opened and reopened, but not edited: a re-run of the workflow would open a second pull
    # request for the same submission, and a person fixing a typo should not cause that. A failed
    # run is retried with /recheck on the issue.
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: 'The submission issue number.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    # Only the issues the website writes, and only ones that are really a submission.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, 'Mod submission:')
    # One check per issue at a time. A recheck asked for while this is still reviewing takes
    # over, rather than two runs updating the same comment with different answers.
    concurrency:
      group: submission-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: true
    uses: ./.github/workflows/check.yml
    with:
      issue: ${{ github.event.issue.number || inputs.issue }}
      mode: auto
    secrets: inherit
